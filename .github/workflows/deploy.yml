name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepara nome das imagens (lowercase)
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${REPO_LC}-backend:latest" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${REPO_LC}-frontend:latest" >> $GITHUB_ENV

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem do Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BACKEND }}

      - name: Build e push da imagem do Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}

      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dsc.rodrigor.com
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            # Log in to GitHub Container Registry using the session's temporary token
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Export production image environment variables
            export BACKEND_IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend:latest"
            export FRONTEND_IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-frontend:latest"
            
            # Create the docker-compose file on the server dynamically
            cat << 'EOF' > ~/docker-compose.prod.yml
            version: '3.8'

            services:
              postgres:
                image: postgres:16-alpine
                container_name: eq20_postgres
                restart: always
                environment:
                  - POSTGRES_USER=eq20
                  - POSTGRES_PASSWORD=0rl0ajunSM4HFlUCC2Ha
                  - POSTGRES_DB=eq20
                ports:
                  - "5432:5432"
                volumes:
                  - pgdata_prod:/var/lib/postgresql/data
                networks:
                  - eq20-network

              backend:
                image: ${BACKEND_IMAGE}
                container_name: eq20_backend
                restart: always
                environment:
                  - DATABASE_URL=postgresql://eq20:0rl0ajunSM4HFlUCC2Ha@postgres:5432/eq20
                  - SECRET_KEY=0rl0ajunSM4HFlUCC2Ha_SECRET_KEY_PROD
                depends_on:
                  - postgres
                networks:
                  - eq20-network

              frontend:
                image: ${FRONTEND_IMAGE}
                container_name: eq20_frontend
                restart: always
                ports:
                  - "8120:80"
                depends_on:
                  - backend
                networks:
                  - eq20-network

            volumes:
              pgdata_prod:

            networks:
              eq20-network:
                driver: bridge
            EOF
            
            # Pull new image tags
            docker compose -f ~/docker-compose.prod.yml pull
            
            # Restart modified services and clean up orphans
            docker compose -f ~/docker-compose.prod.yml up -d --remove-orphans
            
            # Log out from registry to secure credentials
            docker logout ghcr.io


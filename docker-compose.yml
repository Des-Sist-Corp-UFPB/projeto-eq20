version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: riou_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=riou
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: riou_redis
    restart: always
    ports:
      - "6379:6379"

  app:
    image: ghcr.io/des-sist-corp-ufpb/projeto-eq20:latest
    build: .
    container_name: riou_app
    restart: always
    ports:
      - "127.0.0.1:8120:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/riou
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=https://s3.dsc.rodrigor.com
      - S3_PUBLIC_ENDPOINT=https://s3.dsc.rodrigor.com
      - S3_BUCKET=eq20
      - S3_ACCESS_KEY=eq20
      - S3_SECRET_KEY=2qMwQDKJ9je55RVcK0YIkd2A
      - S3_REGION=us-east-1
      - OTEL_SERVICE_NAME=dsc-eq20
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.dsc.rodrigor.com
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      - OTEL_PYTHON_LOG_CORRELATION=true
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: riou_worker
    restart: always
    command: opentelemetry-instrument python -m app.worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/riou
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=https://s3.dsc.rodrigor.com
      - S3_PUBLIC_ENDPOINT=https://s3.dsc.rodrigor.com
      - S3_BUCKET=eq20
      - S3_ACCESS_KEY=eq20
      - S3_SECRET_KEY=2qMwQDKJ9je55RVcK0YIkd2A
      - S3_REGION=us-east-1
      - OTEL_SERVICE_NAME=dsc-eq20-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.dsc.rodrigor.com
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      - OTEL_PYTHON_LOG_CORRELATION=true
    depends_on:
      - db
      - redis

volumes:
  pgdata:

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: urbanacare_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=urbanacare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: ghcr.io/des-sist-corp-ufpb/projeto-eq20:latest
    build: .
    container_name: urbanacare_app
    restart: always
    ports:
      - "127.0.0.1:8120:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/urbanacare
    depends_on:
      - db

volumes:
  pgdata:

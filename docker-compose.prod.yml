version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eq20_postgres
    restart: always
    environment:
      - POSTGRES_USER=eq20
      - POSTGRES_PASSWORD=0rl0ajunSM4HFlUCC2Ha
      - POSTGRES_DB=eq20
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - eq20-network

  redis:
    image: redis:7-alpine
    container_name: eq20_redis
    restart: always
    networks:
      - eq20-network

  app:
    image: ${IMAGE:-ghcr.io/des-sist-corp-ufpb/projeto-eq20:latest}
    container_name: eq20_app
    restart: always
    ports:
      - "127.0.0.1:8120:8080"
    environment:
      - DATABASE_URL=postgresql://eq20:0rl0ajunSM4HFlUCC2Ha@postgres:5432/eq20
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=0rl0ajunSM4HFlUCC2Ha_SECRET_KEY_PROD
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_ENDPOINT=https://s3.dsc.rodrigor.com
      - S3_ACCESS_KEY=eq20
      - S3_SECRET_KEY=2qMwQDKJ9je55RVcK0YIkd2A
      - S3_REGION=us-east-1
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_MODEL=${AI_MODEL}
      - OTEL_SERVICE_NAME=dsc-eq20
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.dsc.rodrigor.com
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      - OTEL_PYTHON_LOG_CORRELATION=true
    depends_on:
      - postgres
      - redis
    networks:
      - eq20-network

  worker:
    image: ${IMAGE:-ghcr.io/des-sist-corp-ufpb/projeto-eq20:latest}
    container_name: eq20_worker
    restart: always
    command: opentelemetry-instrument python -m app.worker
    environment:
      - DATABASE_URL=postgresql://eq20:0rl0ajunSM4HFlUCC2Ha@postgres:5432/eq20
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=0rl0ajunSM4HFlUCC2Ha_SECRET_KEY_PROD
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_ENDPOINT=https://s3.dsc.rodrigor.com
      - S3_BUCKET=eq20
      - S3_ACCESS_KEY=eq20
      - S3_SECRET_KEY=2qMwQDKJ9je55RVcK0YIkd2A
      - S3_REGION=us-east-1
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_MODEL=${AI_MODEL}
      - OTEL_SERVICE_NAME=dsc-eq20-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.dsc.rodrigor.com
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      - OTEL_PYTHON_LOG_CORRELATION=true
    depends_on:
      - postgres
      - redis

    networks:
      - eq20-network

volumes:
  pgdata_prod:

networks:
  eq20-network:
    driver: bridge

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Ocorrências Urbanas</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <h1>Lista de Ocorrências Urbanas</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Tipo</th>
                <th>Descrição</th>
                <th>Localização</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ocorrencia : ${ocorrencias}">
                <td th:text="${ocorrencia.id}"></td>
                <td th:text="${ocorrencia.tipo}"></td>
                <td th:text="${ocorrencia.descricao}"></td>
                <td th:text="${ocorrencia.localizacao}"></td>
                <td th:text="${ocorrencia.status}"></td>
                <td>
                    <a th:href="@{/ocorrencias/edit/{id}(id=${ocorrencia.id})}">Editar</a>
                    <a th:href="@{/ocorrencias/delete/{id}(id=${ocorrencia.id})}" th:onclick="return confirm('Tem certeza que deseja excluir esta ocorrência?');">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a href="/ocorrencias/new">Registrar Nova Ocorrência</a>
</body>
</html>

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ocorrencias_db
    username: your_username
    password: your_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

server:
  port: 8080

logging:
  level:
    org.springframework: INFO
    br.ufpb.dsc.ocorrencias: DEBUG

# Additional configurations can be added here as needed.